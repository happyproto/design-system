name: Release

# semantic-release owns versioning: it reads the conventional commits since the
# last tag, decides the bump, writes package.json and CHANGELOG.md, tags, and
# publishes. There is deliberately no tag trigger — a human pushing a tag would
# race the tool for control of the version.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. Two concurrent runs would both compute "the next
# version" from the same baseline and one would publish over the other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write # commit package.json + CHANGELOG, push the tag, cut the release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # OIDC trusted publishing, and provenance attestation
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release determines the next version from the commits since
          # the last tag, so a shallow clone would make it misread the history.
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The gates run before anything is published, not after. A palette that
      # fails AAA must never reach the registry.
      - run: bun test
      - run: bunx tsc --noEmit

      - uses: actions/setup-node@v7
        with:
          # Node 24.20.0 bundles npm 11.19.0. Trusted publishing needs npm
          # 11.5.1+, so this pin is load-bearing, not incidental.
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'

      # No NPM_TOKEN. Publishing authenticates by OIDC against the trusted
      # publisher registered on npmjs.com for this repo and this workflow file
      # — which is why renaming this file breaks releases until the publisher
      # is updated to match.
      - run: npx --yes semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
